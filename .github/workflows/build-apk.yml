name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # GitHub's ubuntu runners ship with the Android SDK (ANDROID_HOME is set),
      # so no separate SDK setup step is needed; Gradle fetches anything missing.
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Write google-services.json (from secret)
        env:
          GS: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "$GS" ]; then
            echo "::error::GOOGLE_SERVICES_JSON secret is not set. Register the Android app in Firebase (package com.bountyradar.app), then add the base64 of google-services.json as that secret."
            exit 1
          fi
          echo "$GS" | base64 -d > android/app/google-services.json
          echo "Wrote android/app/google-services.json ($(wc -c < android/app/google-services.json) bytes)"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bountyradar-apk
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
