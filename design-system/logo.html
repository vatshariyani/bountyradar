<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Bounty Radar logo</title>
<style>
  body{margin:0;background:#050605;color:#ECEFED;font-family:system-ui,Segoe UI,sans-serif;padding:32px}
  .row{display:flex;gap:28px;align-items:center;flex-wrap:wrap;margin-bottom:28px}
  .tile{background:#0A0C0B;border:1px solid #242927}
  .cap{font-size:12px;color:#8B9590;margin-top:8px;text-align:center}
  .word{display:flex;align-items:center;gap:12px;font-size:28px;font-weight:600;letter-spacing:-0.03em}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <symbol id="mark" viewBox="21 21 66 66">
      <path d="M54,54 L54,30 A24,24 0 0 1 78,54 Z" fill="#3DDC97" fill-opacity="0.22"/>
      <path d="M78,54 A24,24 0 1 1 54,30" fill="none" stroke="#3DDC97" stroke-width="5" stroke-linecap="round"/>
      <circle cx="54" cy="54" r="4" fill="#3DDC97"/>
      <circle cx="71" cy="37" r="4.8" fill="#ECEFED"/>
    </symbol>
  </defs>
</svg>

<div class="row">
  <div><div class="tile" style="width:192px;height:192px;border-radius:50%;display:grid;place-items:center"><svg width="176" height="176"><use href="#mark"/></svg></div><div class="cap">Circle mask</div></div>
  <div><div class="tile" style="width:192px;height:192px;border-radius:44px;display:grid;place-items:center"><svg width="176" height="176"><use href="#mark"/></svg></div><div class="cap">Squircle mask</div></div>
  <div><div class="tile" style="width:72px;height:72px;border-radius:18px;display:grid;place-items:center"><svg width="66" height="66"><use href="#mark"/></svg></div><div class="cap">Home screen</div></div>
  <div><div class="tile" style="width:36px;height:36px;border-radius:10px;display:grid;place-items:center"><svg width="33" height="33"><use href="#mark"/></svg></div><div class="cap">Small</div></div>
</div>
<div class="row">
  <div class="word"><svg width="44" height="44"><use href="#mark"/></svg>Bounty Radar</div>
</div>
</body>
</html>
